[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
interpreter_python = /usr/bin/python3
# Secretos de cada grupo desde OpenBao (docs/secretos.md): ya no hay
# vault.yml. host_group_vars es el de siempre (group_vars/).
vars_plugins = ./vars_plugins
vars_plugins_enabled = host_group_vars, bao_secretos
