# Version fijada a proposito: solo cambia cuando subo el numero.
homepage_version: "v2.3.0"

# La version de Next.js de Homepage exige Node >= 22.
nodejs_major_version: "22"

homepage_title: "Homelab"

# Presentacion del panel; rutas y destinos estan en all/services.yml.
homepage_category_order:
  - Infraestructura
  - Documentos y wiki
  - Multimedia
  - Descargas y biblioteca
  - Automatizacion e IA
  - Comunicacion
  - Juegos
  - Webs personales
homepage_category_icons:
  Infraestructura: mdi-server-network
  Documentos y wiki: mdi-notebook-outline
  Multimedia: mdi-play-circle-outline
  Descargas y biblioteca: mdi-bookshelf
  Automatizacion e IA: mdi-robot-outline
  Comunicacion: mdi-message-outline
  Juegos: mdi-gamepad-variant-outline
  Webs personales: mdi-web
# Homepage no necesita enlazarse a si mismo.
homepage_hidden_services:
  - Threadfin
