# Version fijada a proposito (igual que element_web_version) - un bump
# manual, nunca una actualizacion sola en un re-run.
# renovate: datasource=docker depName=ghcr.io/gethomepage/homepage
homepage_version: "v2.5.0"

# Next.js 16 (el que usa esta version de Homepage) exige Node >= 22 - ver
# nota en roles/homepage/tasks/main.yml.
nodejs_major_version: "22"

homepage_title: "Luciel · Homelab"

# Presentación del dashboard; rutas y destinos siguen en all/services.yml.
homepage_category_order:
  - Infraestructura
  - Documentos y wiki
  - Multimedia
  - Descargas y biblioteca
  - Automatizacion e IA
  - Comunicacion
  - Juegos
  - BattlePros
  - Webs personales
homepage_category_icons:
  Infraestructura: mdi-server-network
  Documentos y wiki: mdi-notebook-outline
  Multimedia: mdi-play-circle-outline
  Descargas y biblioteca: mdi-bookshelf
  Automatizacion e IA: mdi-robot-outline
  Comunicacion: mdi-message-outline
  Juegos: mdi-gamepad-variant-outline
  BattlePros: mdi-sword-cross
  Webs personales: mdi-web
# Threadfin está retirado según el runbook de migración del CT122.
# Homepage no necesita enlazarse a sí mismo.
