# Fuente de verdad compartida entre roles (traefik y homepage): las rutas
# publicas y los servicios solo de la red local. Vive en group_vars/all para
# que todos los hosts la carguen.
#
# Para anadir un servicio basta con anadirlo aqui y ejecutar los playbooks de
# traefik y homepage; nunca toco Cloudflare ni Homepage a mano.

# Registros de Cloudflare que la reconciliacion de DNS (rol traefik) nunca
# debe borrar aunque no tengan ruta: son para cosas que no pasan por Traefik.
cloudflare_protected_records:
  - "vpn.example.org"

# Rutas publicas.
traefik_routes:
  - name: ai-example-org
    category: "Automatizacion e IA"
    icon: "mdi-robot-outline"
    host: "ai.example.org"
    service_url: "http://192.0.2.24:3500"
    middlewares: ["sec_headers@file"]

  - name: amp-example-org
    category: "Juegos"
    icon: "mdi-gamepad-variant"
    host: "amp.example.org"
    service_url: "http://192.0.2.17:8080"
    middlewares: ["amp_headers@file", "forwarded_headers@file"]

  - name: books-example-org
    category: "Descargas y biblioteca"
    icon: "mdi-bookshelf"
    host: "books.example.org"
    service_url: "http://192.0.2.24:8083"
    middlewares: ["sec_headers@file"]

  # Element Web: nginx sirve la aplicacion estatica y Traefik hace TLS y
  # enrutado por delante.
  - name: element-example-org
    category: "Comunicacion"
    icon: "element"
    host: "element.example.org"
    service_url: "http://192.0.2.31:80"
    middlewares: ["sec_headers@file"]

  # Panel de servicios, protegido con autenticacion basica.
  - name: homepage-example-org
    category: "Infraestructura"
    icon: "homepage"
    host: "homepage.example.org"
    service_url: "http://192.0.2.29:3000"
    middlewares: ["sec_headers@file", "auth@file"]


  - name: lazylibrarian-example-org
    category: "Descargas y biblioteca"
    icon: "lazylibrarian"
    host: "lazylibrarian.example.org"
    service_url: "http://192.0.2.24:5299"
    middlewares: ["sec_headers@file"]

  # Homeserver Matrix (Synapse). Traefik hace TLS.
  - name: matrix-example-org
    category: "Comunicacion"
    icon: "matrix"
    host: "matrix.example.org"
    service_url: "http://192.0.2.32:8008"
    middlewares: ["sec_headers@file"]

  - name: n8n-example-org
    category: "Automatizacion e IA"
    icon: "n8n"
    host: "n8n.example.org"
    service_url: "http://192.0.2.30:5678"
    middlewares: ["sec_headers@file"]

  - name: overseerr-example-org
    category: "Multimedia"
    icon: "overseerr"
    host: "overseerr.example.org"
    service_url: "http://192.0.2.24:5055"
    middlewares: ["sec_headers@file"]

  - name: plex-example-org
    category: "Multimedia"
    icon: "plex"
    host: "plex.example.org"
    service_url: "https://192.0.2.11:32400"
    pass_host_header: false
    server_transport: "insecure_skip@file"
    middlewares: ["sec_headers@file"]

  - name: tautulli-example-org
    category: "Multimedia"
    icon: "tautulli"
    host: "tautulli.example.org"
    service_url: "http://192.0.2.24:8181"
    middlewares: ["sec_headers@file"]

  # Dominio apex propio.
  - name: example-com
    category: "Webs personales"
    icon: "mdi-account-circle-outline"
    host: "example.com"
    service_url: "https://192.0.2.14:443"
    middlewares: ["sec_headers@file"]

  - name: www-example-net
    category: "Webs personales"
    icon: "mdi-sword-cross"
    host: "www.example.net"
    service_url: "http://192.0.2.24:3010"
    middlewares: ["sec_headers@file"]

