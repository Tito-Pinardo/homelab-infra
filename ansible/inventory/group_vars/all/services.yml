# Fuente de verdad compartida entre roles (traefik Y homepage): las rutas
# publicas y los servicios solo-LAN. Vive en group_vars/all porque Homepage
# (grupo homepage_web) necesita leer traefik_routes sin pertenecer al grupo
# traefik_prod - Ansible carga group_vars/all/* para TODOS los hosts.
#
# Anadir un servicio nuevo aqui (publico o local) y correr los playbooks de
# traefik y/o homepage es lo unico que hace falta - nunca tocar el panel de
# Cloudflare ni la config de Homepage a mano.

# Registros de Cloudflare que el reconcile de DNS (role traefik) NUNCA debe
# borrar aunque no tengan ruta en traefik_routes - existen para cosas que no
# son HTTP y por tanto no pasan por Traefik. Incidente real 2026-09-16: se
# borro "vpn.example.org" (el hostname que usa el WireGuard del MikroTik
# para resolverse con IP dinamica) por no tener router, cortando el acceso
# VPN del usuario. Recreado (CNAME sin proxy al apex, que SI tiene un A
# dinamico) - protegido aqui para que no se repita.
cloudflare_protected_records:
  - "vpn.example.org"

# Rutas migradas 1:1 desde conf.d/*.yml del 109 (31 servicios) - movido desde
# group_vars/traefik_prod/vars.yml el 2026-09-15 para que homepage_web pueda
# leerlo tambien.
traefik_routes:
  - name: amp-example-org
    category: "Juegos"
    icon: "mdi-gamepad-variant"
    host: "amp.example.org"
    service_url: "http://192.0.2.136:8080"
    middlewares: ["amp_headers@file", "forwarded_headers@file"]

  - name: books-example-org
    category: "Descargas y biblioteca"
    icon: "mdi-bookshelf"
    host: "books.example.org"
    service_url: "http://192.0.2.243:8083"
    middlewares: ["sec_headers@file"]

  # Añadido junto con el CT 110 (Element Web) - nginx sirve el SPA estático
  # en el puerto 80, Traefik solo hace de TLS/routing por delante.
  - name: element-example-org
    category: "Comunicacion"
    icon: "element"
    host: "element.example.org"
    service_url: "http://192.0.2.253:80"
    middlewares: ["sec_headers@file"]

  # Retirado 2026-09-15: el servicio ya no existe en 192.0.2.122:2283.
  # Prueba real del prune automatico (router + DNS) - ver runbook.
  # - name: immich-example-org
  #   host: "immich.example.org"
  #   service_url: "http://192.0.2.122:2283"
  #   middlewares: ["sec_headers@file"]

  # Homeserver Matrix (CT 111, Synapse). Cliente HTTP simple en :8008,
  # Traefik hace TLS. Sin CORS especial - Synapse ya lo maneja el mismo.
  - name: matrix-example-org
    category: "Comunicacion"
    icon: "matrix"
    host: "matrix.example.org"
    service_url: "http://192.0.2.254:8008"
    middlewares: ["sec_headers@file"]

  - name: overseerr-example-org
    category: "Multimedia"
    icon: "overseerr"
    host: "overseerr.example.org"
    service_url: "http://192.0.2.243:5055"
    middlewares: ["sec_headers@file"]

  - name: plex-example-org
    category: "Multimedia"
    icon: "plex"
    host: "plex.example.org"
    service_url: "https://192.0.2.3:32400"
    pass_host_header: false
    server_transport: "insecure_skip@file"
    middlewares: ["sec_headers@file"]

  # Web personal (CT 125, docs/landing.md). Dominio apex propio: el registro A
  # lo mantiene dns_sync. Sin sec_headers a proposito: el binario ya pone
  # HSTS, CSP y el resto, y sec_headers le cambiaria el Referrer-Policy.
  - name: titopinardogutierrez-com
    category: "Webs personales"
    icon: "mdi-account-circle-outline"
    host: "titopinardogutierrez.com"
    service_url: "http://192.0.2.242:8080"

  # www -> apex (2026-10-09): la landing usa el apex como URL canonica.
  - name: www-titopinardogutierrez-com
    category: "Webs personales"
    icon: "mdi-account-circle-outline"
    host: "www.titopinardogutierrez.com"
    redirect_to: "https://titopinardogutierrez.com"

  # Web del bot battlepros-status (CT dockge). Retirada el 2026-09-26 y
  # vuelta a publicar el 2026-10-09 a peticion del usuario, despues de exigir
  # sesion de admin en /api/upload (antes cualquiera podia subir ficheros).
  - name: www-battlepros-club
    category: "BattlePros"
    icon: "mdi-sword-cross"
    host: "www.example.net"
    service_url: "http://192.0.2.243:3010"
    middlewares: ["sec_headers@file"]

  # example.net (apex, en naranja en Cloudflare) -> www (2026-10-09).
  - name: battlepros-club
    category: "Webs personales"
    icon: "mdi-sword-cross"
    host: "example.net"
    redirect_to: "https://www.example.net"

