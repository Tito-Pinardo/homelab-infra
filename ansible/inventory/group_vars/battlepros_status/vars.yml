# battlepros-status (bot de Discord, estado de servidores AMP) - sustituye
# al stack manual en el CT106 original. AMP_BASE_URL sigue apuntando por
# LAN directo (no al dominio publico) - bug ya corregido y documentado en
# project_battlepros_status, no revertir.
battlepros_amp_base_url: "http://192.0.2.136:8080"
# URL publica de AMP para enlazar su pagina Community (/c/<id>) desde los
# mensajes de Discord del bot (solo instancias con direccion anunciada).
battlepros_amp_community_url: "https://amp.example.org"
battlepros_amp_username: "bot_discord_status"
battlepros_discord_client_id: "000000000000000000"
# Login con Discord del panel: sin uso desde 2026-10-09 (el panel esta en
# battlepros.home.arpa y entra con Authelia). Se deja por si se vuelve atras.
battlepros_discord_oauth_redirect_uri: "https://www.example.net/api/auth/discord/callback"
battlepros_node_env: "production"
battlepros_panel_admin_discord_id: "000000000000000000"
battlepros_status_refresh_seconds: "10"

battlepros_ghcr_user: "{{ vault_battlepros_ghcr_user }}"
battlepros_ghcr_token: "{{ vault_battlepros_ghcr_token }}"

amp_2fa_secret: "{{ vault_battlepros_amp_2fa_secret }}"
amp_password: "{{ vault_battlepros_amp_password }}"
discord_client_secret: "{{ vault_battlepros_discord_client_secret }}"
discord_token: "{{ vault_battlepros_discord_token }}"
