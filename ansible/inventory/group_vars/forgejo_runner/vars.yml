# CT 127 "forgejo-runner" - ejecuta el CI de Forgejo en modo host (sin
# Docker). Sin secretos a proposito y nunca aplica: ver lxc-forgejo.tf y
# docs/forgejo.md.

# Al actualizar, cambiar version y suma (fichero .sha256 de la release).
# renovate: datasource=forgejo-releases depName=forgejo/runner registryUrl=https://code.forgejo.org extractVersion=^v(?<version>.+)$
forgejo_runner_version: "13.2.0"
forgejo_runner_sha256: "fadaec897f5e6641c363f87ecaf75f866f99c81b7097ec6b433e4c48123fcad1"

# Etiquetas que piden los workflows en runs-on: infra-tf y la web personal.
# Al cambiarlas, relanzar el playbook (registro y config) y reiniciar el runner.
forgejo_runner_labels: ["infra-tf", "landing"]

# Herramientas del CI, misma version que el CT 123 (donde se aplica de
# verdad) para que el CI no diga otra cosa que la terminal.
# renovate: datasource=docker depName=hashicorp/terraform
ci_terraform_version: "1.16.6"
ci_terraform_sha256: "38034b38d03096399a7a1264a14561a8029b2b496fd1f169452656e53968f1b7"
# renovate: datasource=docker depName=zricethezav/gitleaks extractVersion=^v(?<version>.+)$
ci_gitleaks_version: "8.30.1"
# renovate: datasource=docker depName=aquasec/trivy
ci_trivy_version: "0.75.0"
ci_trivy_sha256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
# renovate: datasource=docker depName=ghcr.io/terraform-linters/tflint extractVersion=^v(?<version>.+)$
ci_tflint_version: "0.64.0"
ci_tflint_sha256: "cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537"
ci_gitleaks_sha256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
# renovate: datasource=pypi depName=ansible-core
ci_ansible_core_version: "2.21.5"
# renovate: datasource=pypi depName=ansible-lint
ci_ansible_lint_version: "26.10.1"

# CI de la web (Rust). Misma toolchain que el CT 123, que compila lo que se
# despliega. rustup-init: fichero .sha256 junto al binario en
# static.rust-lang.org/rustup/archive/<version>/x86_64-unknown-linux-gnu/.
ci_rust_version: "1.99.0"
ci_rustup_version: "1.29.1"
ci_rustup_sha256: "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"
ci_cargo_target_dir: /var/lib/forgejo-runner/cargo-target
# 2 vCPU y 2 GB: dos compilaciones a la vez caben (pico ~1,3 GB en clippy, 14-10).
ci_cargo_jobs: 2

forgejo_runner_ssh_allowed_sources: []  # se define en el inventario privado

# CA interna del Caddy de dockge: el runner habla con https://git.home.arpa.
forgejo_runner_caddy_ca: /opt/stacks/arr/proxy/caddy_data/caddy/pki/authorities/local/root.crt

# Se reinicia si cambia una raiz de la CA de casa (rol ca_casa): habla con
# Forgejo por https://git.home.arpa.
ca_casa_reiniciar: [forgejo-runner]
