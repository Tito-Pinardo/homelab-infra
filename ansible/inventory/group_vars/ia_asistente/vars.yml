# Ollama NO se instala desde aqui desde el 17-09 (corre en lucifer, con GPU, y
# lo actualiza pacman). Esta variable solo la lee Hefesto
# (versiones_pinned.json): poner la de lucifer (pacman -Q ollama). Sin
# Renovate a proposito: subirla aqui no instala nada.
ollama_version: "0.40.3"

# Demeter: captura independiente, gestionada por playbooks/demeter.yml.
# Solo genera candidatos por revisar; no contabiliza ni publica avisos.
demeter_capture_enabled: true
demeter_capture_limit: 100

# Ollama de EMBEDDINGS, local a este CT (headless, CPU, nomic-embed-text).
ia_embeddings_ollama_url: "http://192.0.2.30:11434"
ia_embeddings_model: "nomic-embed-text"

# Ollama de CHAT (razonamiento + tool-use), NO vive en este CT - vive en el
# PC lucifer (GPU RTX 2070S), consultado por red. Decision explicita del
# usuario (2026-09-16): "nada sale de mi red" - ver runbook. Consecuencia
# aceptada: el bot no responde si ese PC esta apagado.
ia_chat_ollama_url: "http://192.0.2.30:11434"
ia_chat_model: "qwen3:8b"
# Espacio para herramientas, resultados e historial sin agotar 4096 tokens.
ia_chat_num_ctx: 8192

# Qdrant (CT 115).
ia_qdrant_url: "http://192.0.2.246:6333"

# Snapshot de Zabbix/Wazuh (Fase 4) - empujado desde el host Proxmox por
# cron (fuera de infra-tf, ese host no esta gestionado por Ansible). Clave
# publica, no secreta - puede vivir aqui en claro.
ia_monitoring_push_pubkey: "ssh-ed25519 AAAA...clave-publica usuario@equipo"
ia_monitoring_snapshot_path: "/var/lib/monitoring-push/monitoring_snapshot.json"

# Estructura de Matrix creada el 2026-09-16 (Space "Casa" + salas dedicadas
# por tema, ver runbook). Las salas AMP/Correo son de solo-notificacion
# (el bot NO responde ahi, solo en ia_room) - pensadas para cuando se
# implementen las notificaciones proactivas (pendiente de diseño).
ia_matrix_space_id: "!sala:example.org:matrix.example.org"
ia_matrix_room_asistente: "!sala:example.org:matrix.example.org"
ia_matrix_room_alertas: "!sala:example.org:matrix.example.org"
ia_matrix_room_amp: "!sala:example.org:matrix.example.org"
ia_matrix_room_correo: "!sala:example.org:matrix.example.org"
# Cronos - creada 2026-09-18 para sacar los avisos de calendario (eventos
# creados desde correos de reserva, recordatorios) de la sala de Correo,
# que quiero reservada solo para avisos de correo importante.
ia_matrix_room_eventos: "!sala:example.org:matrix.example.org"
# Demeter - creada 2026-09-17 como hueco para descargas (nunca se uso: esas
# ya se avisan por Discord+Overseerr). Desde 2026-09-23 es la sala de las
# COMPRAS: Hermes anuncia ahi las que Demeter aprueba sola, y reaccionar con
# la papelera las deshace (demeter_watcher / on_reaction en ia_bot.py).
ia_matrix_room_demeter: "!sala:example.org:matrix.example.org"
# Pitia - creada 2026-09-17, resumen diario proactivo (calendario + AMP +
# salud general + avisos de Mnemosine/Argos/Atlas si hay algo anormal).
ia_matrix_room_pitia: "!sala:example.org:matrix.example.org"
# Mnemosine/Argos/Atlas - a diferencia de las de arriba, estas SI aceptan
# preguntas del usuario (ver QUERY_ROOMS en ia_bot.py), no son solo-notificacion.
ia_matrix_room_mnemosine: "!sala:example.org:matrix.example.org"
ia_matrix_room_argos: "!sala:example.org:matrix.example.org"
ia_matrix_room_atlas: "!sala:example.org:matrix.example.org"
ia_matrix_room_hefesto: "!sala:example.org:matrix.example.org"
ia_matrix_room_hipnos: "!sala:example.org:matrix.example.org"
ia_matrix_room_nemesis: "!sala:example.org:matrix.example.org"

