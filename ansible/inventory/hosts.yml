# Inventario estático: pocos hosts en un homelab, no compensa una inventory
# dinámica todavía. Las IPs vienen de los outputs de Terraform (misma fuente
# de verdad, copiadas a mano por ahora).
all:
  children:
    # CT 209 = el Traefik real (ex "traefik-test", promovido a producción el
    # 2026-09-15 - ver runbook "Terraform en Proxmox" en Obsidian). El CT 109
    # original queda retirado. group_vars/traefik_prod tiene los 31+ dominios
    # reales y el token de Cloudflare (cifrado en vault.yml).
    traefik_prod:
      hosts:
        traefik:
          ansible_host: 192.0.2.6
    element_web:
      hosts:
        element:
          ansible_host: 192.0.2.253
    synapse_server:
      hosts:
        synapse:
          ansible_host: 192.0.2.254
    homepage_web:
      hosts:
        homepage:
          ansible_host: 192.0.2.250
    # Alpine (no Debian) - primer CT del repo con esta base, ver
    # lxc-dns-sync.tf. Sustituye al CT 105 "scripts" (ya no existe;
    # su agente Wazuh 004 se borro el 2026-09-24).
    dns_sync:
      hosts:
        dns-sync:
          ansible_host: 192.0.2.249
    # n8n (CT 114, Debian + Docker) - sustituye al CT 102. Solo el workflow
    # real (divxtotal + qBittorrent) se migro - ver lxc-n8n.tf y el runbook.
    n8n_movies:
      hosts:
        n8n:
          ansible_host: 192.0.2.251
    # Plex (CT 117, sin privilegios + idmap/device_passthrough para la GTX
    # 1050 Ti - ver lxc-plex.tf y el runbook). PROMOVIDO A DEFINITIVO
    # 2026-09-16 (probado con clientes reales, TV transcodificando bien) -
    # hostname "plex" e IP .3 (la que ya conocian todos los clientes/TVs).
    plex_media:
      hosts:
        plex:
          ansible_host: 192.0.2.3
    # CT 115/118 - proyecto "asistente IA + base semantica" (ver runbook en
    # Obsidian). Qdrant separado del CT del bot/conectores a proposito (es
    # el unico con estado persistente critico). El modelo de CHAT vive fuera
    # de este inventario del todo (PC lucifer, GPU) - solo el de embeddings
    # esta aqui, en ia_asistente.
    qdrant:
      hosts:
        qdrant:
          ansible_host: 192.0.2.246
    ia_asistente:
      hosts:
        ia-asistente:
          ansible_host: 192.0.2.247
    # Paperless-ngx (CT 119, sustituye al CT 133) - documentos personales
    # sensibles. Connection plugin DISTINTO al resto de la flota a
    # proposito: sin SSH en el contenedor (ver lxc-paperless.tf para el
    # porque). community.proxmox.proxmox_pct_remote ejecuta 'pct exec'
    # via SSH AL HOST PROXMOX (reusa la misma clave root que ya usa todo
    # el repo), nunca al CT en si.
    #
    # FUERA DEL ALCANCE DE CUALQUIER AGENTE IA (Claude Code, Codex, Gemini,
    # OpenCode, CT 123 'agents') por decision mia (2026-09-22): son
    # documentos oficiales/confidenciales. Si playbooks/paperless.yml falla
    # desde un agente, es lo esperado - no arreglarlo ni buscar otra via
    # (pct enter/exec, montar su disco, API). Solo lo gestiona el usuario.
    paperless:
      hosts:
        paperless:
          ansible_host: 192.0.2.2
          ansible_connection: community.proxmox.proxmox_pct_remote
          ansible_user: root
          proxmox_vmid: 119
    # CT 120 "technitium" - DNS de toda la LAN, sustituye al CT 116 (ahora
    # "technitium-old", parado en .248, ver lxc_existentes). Promovido a
    # definitivo 2026-09-18 (zonas restauradas desde el CT116, resolucion
    # interna+recursiva verificada, cutover de IP sin destruir el CT viejo -
    # ver runbook). group_vars/technitium/vars.yml.
    technitium:
      hosts:
        technitium:
          ansible_host: 192.0.2.45
          proxmox_vmid: 120
    # CT 121 "amp" - panel de servidores de juego (Docker + UFW
    # auto-sincronizado), sustituye al CT 108 (ahora "amp-old", parado en
    # .239, sin los bind-mounts ZFS, ver lxc_existentes). Promovido a
    # definitivo 2026-09-18/19 (10 instancias reconstruidas desde los datos
    # copiados, licencia AMP Advanced reactivada - ver runbook).
    # group_vars/amp_panel/vars.yml.
    amp_panel:
      hosts:
        amp:
          ansible_host: 192.0.2.136
          proxmox_vmid: 121
    # CT 122 "dockge" - sustituye al CT 106 (Tautulli, Seerr,
    # battlepros-status, Obsidian, y el stack grande Caddy+Authelia+arr).
    # Migracion por fases COMPLETADA 2026-09-19 (ver runbook para el detalle
    # de cada fase). Un unico host, varios grupos (uno por servicio, cada
    # uno con su group_vars).
    dockge_base:
      hosts:
        dockge:
          ansible_host: 192.0.2.243
          proxmox_vmid: 122
    # CT 123 "agents" - CT de control + agentes IA con Codeman
    # (agents.home.arpa). Su clave SSH propia se autoriza en toda la flota
    # con playbooks/agents-access.yml. group_vars/agents/vars.yml.
    agents:
      hosts:
        agents:
          ansible_host: 192.0.2.237
          proxmox_vmid: 123
    # CT 124 "iptv" - Dispatcharr (listas IPTV + guia EPG, sintonizador
    # HDHomeRun para Plex). Solo LAN/VPN de momento. group_vars/iptv.
    iptv:
      hosts:
        iptv:
          ansible_host: 192.0.2.244
          proxmox_vmid: 124
    # CT 125 "landing" - titopinardogutierrez.com (binario Rust +
    # PostgreSQL). Unico CT con policy_in DROP. group_vars/landing.
    landing:
      hosts:
        landing:
          ansible_host: 192.0.2.242
          proxmox_vmid: 125
    # CT 126 "forgejo" (git.home.arpa) y CT 127 "forgejo-runner" (CI de
    # infra-tf, sin secretos). group_vars/forgejo y group_vars/forgejo_runner.
    forgejo:
      hosts:
        forgejo:
          ansible_host: 192.0.2.235
          proxmox_vmid: 126
    forgejo_runner:
      hosts:
        forgejo-runner:
          ansible_host: 192.0.2.236
          proxmox_vmid: 127
    # CT 128 "openbao" - llaves maestras de infra-tf, desellado a mano.
    # group_vars/openbao, docs/openbao.md.
    openbao:
      hosts:
        openbao:
          ansible_host: 192.0.2.234
          proxmox_vmid: 128
    # CT 129 "pbs" - Proxmox Backup Server, almacen en lb2. docs/copias.md.
    pbs:
      hosts:
        pbs:
          ansible_host: 192.0.2.233
          proxmox_vmid: 129
    tautulli:
      hosts:
        dockge:
    seerr:
      hosts:
        dockge:
    battlepros_status:
      hosts:
        dockge:
    obsidian:
      hosts:
        dockge:
    arr_stack:
      hosts:
        dockge:
    # Stacks de docker compose que actualiza playbooks/update-containers.yml
    # (nombre -> directorio del compose). Paperless NO: fuera del alcance de
    # los agentes IA (ver arriba). AMP tampoco: sus contenedores son de AMP.
    docker_compose:
      hosts:
        dockge:
          docker_stacks:
            arr: /opt/stacks/arr
            tautulli: /opt/stacks/tautulli
            seerr: /opt/stacks/seerr
            battlepros-status: /opt/stacks/battlepros-status
            obsidian: /opt/stacks/obsidian
        n8n:
          docker_stacks:
            n8n: /opt/n8n
        iptv:
          docker_stacks:
            dispatcharr: /opt/stacks/dispatcharr
    # CT ya existentes antes de infra-tf, no creados por Terraform - se
    # añaden aqui SOLO para poder actualizarlos todos de una vez
    # (playbooks/update-all.yml). Nada de config/roles especificos todavia.
    lxc_existentes:
      hosts:
        # Los "-old" (CT retirados, parados como red de seguridad) se
        # excluyen a proposito de update-all.yml - no tiene sentido
        # actualizar paquetes en un CT parado indefinidamente. zabbix/wazuh
        # siguen aqui: son la monitorizacion activa de toda la flota, no
        # CT retirados.
        # plex-old: RETIRADO 2026-09-16 (sustituido por el CT 117) - .8
        # dockge-old: RETIRADO 2026-09-19 (sustituido por el CT 122) - .238
        # amp-old: RETIRADO 2026-09-18/19 (sustituido por el CT 121) - .239
        # technitium-old: RETIRADO 2026-09-18 (sustituido por el CT 120) - .248
        zabbix:
          ansible_host: 192.0.2.240
        wazuh:
          ansible_host: 192.0.2.241
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
