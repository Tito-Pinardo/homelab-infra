# Inventario estatico: en un homelab no compensa uno dinamico. Las IPs salen
# de los outputs de Terraform.
all:
  children:
    # Traefik de produccion.
    traefik_prod:
      hosts:
        traefik:
          ansible_host: 192.0.2.12
    element_web:
      hosts:
        element:
          ansible_host: 192.0.2.31
    synapse_server:
      hosts:
        synapse:
          ansible_host: 192.0.2.32
    homepage_web:
      hosts:
        homepage:
          ansible_host: 192.0.2.29
    # Alpine. Ver lxc-dns-sync.tf.
    dns_sync:
      hosts:
        dns-sync:
          ansible_host: 192.0.2.28
    # n8n. Ver lxc-n8n.tf.
    n8n:
      hosts:
        n8n:
          ansible_host: 192.0.2.30
    # Plex, sin privilegios y con acceso a la GPU. Ver lxc-plex.tf.
    plex_media:
      hosts:
        plex:
          ansible_host: 192.0.2.11
    # Asistente IA: Qdrant va separado del CT del bot porque es el unico con
    # estado persistente importante. El modelo de chat vive fuera de este
    # inventario (mi PC).
    qdrant:
      hosts:
        qdrant:
          ansible_host: 192.0.2.26
    ia_asistente:
      hosts:
        ia-asistente:
          ansible_host: 192.0.2.27
    # Paperless-ngx: documentos personales. Sin SSH en el contenedor: el
    # connection plugin proxmox_pct_remote ejecuta pct exec por SSH al host
    # Proxmox.
    #
    # Fuera del alcance de los agentes de IA.
    paperless:
      hosts:
        paperless:
          ansible_host: 192.0.2.10
          ansible_connection: community.proxmox.proxmox_pct_remote
          ansible_user: root
          proxmox_vmid: 119
    # Technitium, el DNS de la LAN. Ver group_vars/technitium/vars.yml.
    technitium:
      hosts:
        technitium:
          ansible_host: 192.0.2.15
          proxmox_vmid: 120
    # AMP, panel de servidores de juego. Ver group_vars/amp_panel/vars.yml.
    amp_panel:
      hosts:
        amp:
          ansible_host: 192.0.2.17
          proxmox_vmid: 121
    # dockge: un unico host con varios grupos, uno por servicio con sus
    # group_vars.
    dockge_base:
      hosts:
        dockge:
          ansible_host: 192.0.2.24
          proxmox_vmid: 122
    # Agentes de IA con Codeman. Su clave SSH se autoriza en la flota con
    # playbooks/agents-access.yml.
    agents:
      hosts:
        agents:
          ansible_host: 192.0.2.21
          proxmox_vmid: 123
    tautulli:
      hosts:
        dockge:
    seerr:
      hosts:
        dockge:
    battlepros_status:
      hosts:
        dockge:
    obsidian:
      hosts:
        dockge:
    arr_stack:
      hosts:
        dockge:
    # Stacks de docker compose que actualiza playbooks/update-containers.yml
    # (nombre -> directorio). Paperless y AMP no estan a proposito.
    docker_compose:
      hosts:
        dockge:
          docker_stacks:
            arr: /opt/stacks/arr
            tautulli: /opt/stacks/tautulli
            seerr: /opt/stacks/seerr
            battlepros-status: /opt/stacks/battlepros-status
            obsidian: /opt/stacks/obsidian
        n8n:
          docker_stacks:
            n8n: /opt/n8n
    # CT anteriores a este repositorio, no creados por Terraform. Solo estan
    # aqui para actualizarlos con playbooks/update-all.yml.
    lxc_existentes:
      hosts:
        # Los CT retirados no se incluyen: no tiene sentido actualizar un CT parado.
        zabbix:
          ansible_host: 192.0.2.22
        wazuh:
          ansible_host: 192.0.2.23
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
