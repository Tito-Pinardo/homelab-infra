---
# Actualiza el sistema operativo de todos los CT del inventario, sea cual sea
# el gestor de paquetes (apt o apk). No reinicia servicios ni CT.
# Uso: ansible-playbook playbooks/update-all.yml
- name: Actualizar paquetes en todos los CT
  hosts: all
  become: true
  serial: 3
  tasks:
    - name: apt update + upgrade (Debian)
      when: ansible_pkg_mgr == 'apt'
      block:
        - name: apt update
          ansible.builtin.apt:
            update_cache: true
            cache_valid_time: 0

        - name: apt upgrade (solo paquetes ya instalados, sin dist-upgrade)
          ansible.builtin.apt:
            upgrade: safe

        - name: Comprobar si hace falta reiniciar
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: reboot_required

        - name: Avisar si el CT necesita reboot
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} necesita un reboot tras la actualizacion (no se reinicia solo)"
          when: reboot_required.stat.exists

    - name: apk update + upgrade (Alpine)
      when: ansible_pkg_mgr == 'apk'
      ansible.builtin.apk:
        update_cache: true
        upgrade: true
