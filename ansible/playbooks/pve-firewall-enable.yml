---
# Activa el firewall Proxmox de los CT cuyo .fw solo tenia [RULES].
#
# Bug real encontrado 2026-09-22: sin '[OPTIONS] enable: 1' Proxmox NO
# aplica ninguna regla del .fw - el DROP de SSH "solo PC + VPN" (runbook
# 2026-09-16) y el de Qdrant :6333 no bloqueaban nada (comprobado: desde
# dockge se llegaba a ambos). Los que ya tenian enable (zabbix, wazuh,
# paperless, agents) si filtraban.
#
# policy_in ACCEPT a proposito: la intencion de esos .fw siempre fue "solo
# estos DROP concretos, todo lo demas igual". enable: 1 a secas usaria la
# politica por defecto de Proxmox (DROP) y tiraria Plex, Traefik, DNS...
#
# Antes de activar se auditaron 21 dias de logins SSH y de clientes de
# Qdrant: el unico flujo legitimo que se habria roto es el rsync del vault
# (sync-obsidian.timer) de ia-asistente (.247) -> dockge, de ahi la regla
# extra del 122.
#
# Copia de seguridad de cada .fw en /root/pve-fw-backup/ del host antes de
# tocarlo. Para ir CT a CT: -e '{"pve_fw_vmids": [110]}'
#
# /etc/pve es pmxcfs: se escribe con 'cat >' (ni copy ni lineinfile pueden).

- name: Host Proxmox
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Anadir el host Proxmox al inventario de esta ejecucion
      ansible.builtin.add_host:
        name: pve
        ansible_host: 192.0.2.2
        ansible_user: root
        groups: pve_dynamic

- name: Activar el firewall de los CT
  hosts: pve_dynamic
  gather_facts: false
  vars:
    pve_fw_vmids: [106, 110, 111, 112, 114, 115, 117, 120, 121, 122, 209]
    pve_fw_extra_rules:
      122:
        - "IN ACCEPT -source 192.0.2.247 -p tcp -dport 22 # ia-asistente (sync-obsidian: rsync del vault)"
  tasks:
    - name: Directorio de copias de seguridad
      ansible.builtin.file:
        path: /root/pve-fw-backup
        state: directory
        mode: "0700"

    - name: Reglas extra (antes de activar, para no cortar nada)
      ansible.builtin.shell:
        cmd: |
          f=/etc/pve/firewall/{{ item.0.key }}.fw
          line='{{ item.1 }}'
          grep -qxF "$line" "$f" && exit 0
          cp "$f" /root/pve-fw-backup/{{ item.0.key }}.fw.$(date +%Y%m%d%H%M%S)
          awk -v l="$line" '{print} /^IN ACCEPT -source 192\.168\.1\.30 -p tcp -dport 22( |$)/ && !d {print l; d=1}' "$f" > /root/pve-fw.tmp
          grep -qxF "$line" /root/pve-fw.tmp || { echo "no se encontro donde insertar" >&2; exit 1; }
          cat /root/pve-fw.tmp > "$f" && rm -f /root/pve-fw.tmp && echo CHANGED
      register: pve_fw_extra
      changed_when: "'CHANGED' in pve_fw_extra.stdout"
      loop: "{{ pve_fw_extra_rules | dict2items | selectattr('key', 'in', pve_fw_vmids) | subelements('value') }}"
      loop_control:
        label: "{{ item.0.key }}"

    - name: Anadir [OPTIONS] enable 1 / policy_in ACCEPT
      ansible.builtin.shell:
        cmd: |
          f=/etc/pve/firewall/{{ item }}.fw
          [ -f "$f" ] || { echo "no existe $f" >&2; exit 1; }
          grep -q '^\[OPTIONS\]' "$f" && exit 0
          cp "$f" /root/pve-fw-backup/{{ item }}.fw.$(date +%Y%m%d%H%M%S)
          { printf '[OPTIONS]\nenable: 1\npolicy_in: ACCEPT\npolicy_out: ACCEPT\n\n'; cat "$f"; } > /root/pve-fw.tmp
          cat /root/pve-fw.tmp > "$f" && rm -f /root/pve-fw.tmp && echo CHANGED
      register: pve_fw_enable
      changed_when: "'CHANGED' in pve_fw_enable.stdout"
      loop: "{{ pve_fw_vmids }}"

    - name: Compilar y comprobar la config del firewall
      ansible.builtin.command:
        cmd: pve-firewall compile
      changed_when: false
