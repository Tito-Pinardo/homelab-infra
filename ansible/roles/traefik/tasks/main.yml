---
- name: Crear directorios de Traefik
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/traefik
    - /etc/traefik/conf.d
    - /etc/traefik/ssl
    - /var/log/traefik

# Un directorio por version: con /tmp y 'creates: /tmp/traefik', si quedaba el
# binario de la version anterior no se descargaba la nueva y se reinstalaba
# la vieja (visto el 15-10 con el PR de Renovate).
- name: Directorio de la version {{ traefik_version }}
  ansible.builtin.file:
    path: "/opt/traefik-{{ traefik_version }}"
    state: directory
    mode: "0755"

- name: Descargar y extraer el binario de Traefik {{ traefik_version }}
  ansible.builtin.unarchive:
    src: "https://github.com/traefik/traefik/releases/download/v{{ traefik_version }}/traefik_v{{ traefik_version }}_linux_amd64.tar.gz"
    dest: "/opt/traefik-{{ traefik_version }}"
    remote_src: true
    creates: "/opt/traefik-{{ traefik_version }}/traefik"

- name: Instalar el binario en /usr/bin
  ansible.builtin.copy:
    src: "/opt/traefik-{{ traefik_version }}/traefik"
    dest: /usr/bin/traefik
    mode: "0755"
    remote_src: true
  notify: reiniciar traefik

- name: Desplegar config estática (traefik.yaml)
  ansible.builtin.template:
    src: traefik.yaml.j2
    dest: /etc/traefik/traefik.yaml
    mode: "0644"
  notify: reiniciar traefik

- name: Desplegar middlewares compartidos (00_middlewares.yml)
  ansible.builtin.template:
    src: middlewares.yml.j2
    dest: /etc/traefik/conf.d/00_middlewares.yml
    mode: "0644"
  notify: reiniciar traefik

- name: Desplegar transports compartidos (00_transports.yml)
  ansible.builtin.template:
    src: transports.yml.j2
    dest: /etc/traefik/conf.d/00_transports.yml
    mode: "0644"
  notify: reiniciar traefik

- name: Desplegar dashboard (config dinámica de ejemplo)
  ansible.builtin.template:
    src: dashboard.yml.j2
    dest: /etc/traefik/conf.d/dashboard.yml
    mode: "0644"
  notify: reiniciar traefik

- name: Desplegar un router por cada entrada de traefik_routes
  ansible.builtin.template:
    src: route.yml.j2
    dest: "/etc/traefik/conf.d/{{ item.name }}.yml"
    mode: "0644"
  loop: "{{ traefik_routes | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    route: "{{ item }}"
  notify: reiniciar traefik

- name: Desplegar bloqueo de la pagina static de Synapse (/_matrix/static/)
  ansible.builtin.template:
    src: synapse-static-block.yml.j2
    dest: /etc/traefik/conf.d/synapse-static-block.yml
    mode: "0644"
  notify: reiniciar traefik

- name: Listar ficheros de router ya presentes en conf.d
  # Necesario para el paso siguiente: detectar los que ya no corresponden a
  # ninguna entrada de traefik_routes (se quito el servicio) y borrarlos -
  # si no, el fichero se queda sirviendo para siempre (watch: true los
  # recarga pero nunca los borra solo).
  ansible.builtin.find:
    paths: /etc/traefik/conf.d
    patterns: "*.yml"
    excludes: "00_middlewares.yml,00_transports.yml,dashboard.yml,synapse-static-block.yml"
  register: traefik_existing_route_files

- name: Borrar routers huerfanos (ya no estan en traefik_routes)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ traefik_existing_route_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename | regex_replace('\.yml$','')) not in (traefik_routes | default([]) | map(attribute='name') | list)
  notify: reiniciar traefik

- name: Desplegar cloudflare.env (secreto via ansible-vault; placeholder en el grupo de test)
  ansible.builtin.template:
    src: cloudflare.env.j2
    dest: /etc/traefik/cloudflare.env
    mode: "0600"
  notify: reiniciar traefik

- name: Rotacion de los logs de Traefik
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/traefik
    mode: "0644"

# Plugin del bouncer de CrowdSec, de una version fija y cargado del disco.
- name: Directorio del plugin de CrowdSec {{ traefik_crowdsec_plugin_version | default('') }}
  ansible.builtin.file:
    path: "/opt/crowdsec-traefik-plugin-{{ traefik_crowdsec_plugin_version }}"
    state: directory
    mode: "0755"
  when: traefik_crowdsec | default(false)
  register: traefik_plugin_dir

- name: Descargar el plugin de CrowdSec
  ansible.builtin.unarchive:
    src: "https://github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin/archive/refs/tags/{{ traefik_crowdsec_plugin_version }}.tar.gz"
    dest: "/opt/crowdsec-traefik-plugin-{{ traefik_crowdsec_plugin_version }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "/opt/crowdsec-traefik-plugin-{{ traefik_crowdsec_plugin_version }}/.traefik.yml"
  when:
    - traefik_crowdsec | default(false)
    # En el plan, el directorio de una version nueva aun no existe.
    - not (ansible_check_mode and traefik_plugin_dir.changed)

- name: Carpeta de plugins locales
  ansible.builtin.file:
    path: /etc/traefik/plugins-local/src/github.com/maxlerebourg
    state: directory
    mode: "0755"
  when: traefik_crowdsec | default(false)

- name: Enlazar la version del plugin
  ansible.builtin.file:
    src: "/opt/crowdsec-traefik-plugin-{{ traefik_crowdsec_plugin_version }}"
    dest: /etc/traefik/plugins-local/src/github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
    state: link
    force: true
  when: traefik_crowdsec | default(false)
  notify: reiniciar traefik

- name: Desplegar unidad systemd
  ansible.builtin.template:
    src: traefik.service.j2
    dest: /etc/systemd/system/traefik.service
    mode: "0644"
  notify: reiniciar traefik

- name: Habilitar y arrancar Traefik
  ansible.builtin.systemd:
    name: traefik
    enabled: true
    state: started
    daemon_reload: true

- name: Asegurar CNAME en Cloudflare para cada ruta de example.org
  # Sin esto, una ruta nueva en traefik_routes queda con TLS/routing listo
  # pero sigue dando "no se puede entrar" hasta crear el DNS a mano en el
  # panel de Cloudflare. Se ejecuta en el nodo de control (localhost), no en
  # el CT de Traefik - es una llamada a la API de Cloudflare, no config local.
  # Solo cubre example.org: el token de vault.yml no tiene acceso a las
  # zonas example.net / titopinardogutierrez.com (comprobado con la API,
  # "zone not found") - esas dos rutas se excluyen con el regex de abajo.
  community.general.cloudflare_dns:
    zone: "example.org"
    record: "{{ item.host }}"
    type: CNAME
    value: "example.org"
    proxied: true
    state: present
    api_token: "{{ traefik_cloudflare_api_token }}"
  delegate_to: localhost
  become: false  # llamada a la API; con become fallaba desde agents (sudo pide contraseña)
  loop: "{{ traefik_routes + ([{'host': traefik_dashboard_host}] if traefik_dashboard_public | default(true) else []) }}"
  loop_control:
    label: "{{ item.host }}"
  when:
    - traefik_cloudflare_api_token is defined
    - item.host is regex('\.example.org$')

- name: Resolver zone_id de example.org en Cloudflare
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones?name=example.org"
    headers:
      Authorization: "Bearer {{ traefik_cloudflare_api_token }}"
    return_content: true
  delegate_to: localhost
  become: false  # llamada a la API; con become fallaba desde agents (sudo pide contraseña)
  register: cf_zone_lookup
  check_mode: false  # solo lee (GET): tambien en el plan
  when: traefik_cloudflare_api_token is defined

- name: Listar en Cloudflare los CNAME gestionados por este role (content=example.org)
  # Solo estos son "nuestros" - cualquier otro registro de la zona (MX, TXT,
  # SPF/DKIM, el A del apex, un CNAME manual a otro sitio...) no matchea este
  # filtro y el paso de borrado de abajo nunca lo tocara.
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ cf_zone_lookup.json.result[0].id }}/dns_records?type=CNAME&content=example.org&per_page=100"
    headers:
      Authorization: "Bearer {{ traefik_cloudflare_api_token }}"
    return_content: true
  delegate_to: localhost
  become: false  # llamada a la API; con become fallaba desde agents (sudo pide contraseña)
  register: cf_managed_records
  check_mode: false  # solo lee (GET): tambien en el plan
  when: traefik_cloudflare_api_token is defined

- name: Borrar en Cloudflare los CNAME gestionados que ya no estan en traefik_routes
  community.general.cloudflare_dns:
    zone: "example.org"
    record: "{{ item.name }}"
    type: CNAME
    value: "example.org"
    state: absent
    api_token: "{{ traefik_cloudflare_api_token }}"
  delegate_to: localhost
  become: false  # llamada a la API; con become fallaba desde agents (sudo pide contraseña)
  loop: "{{ cf_managed_records.json.result | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - traefik_cloudflare_api_token is defined
    - item.name not in ((traefik_routes | default([]) | selectattr('host', 'regex', '\.example.org$') | map(attribute='host') | list) + ([traefik_dashboard_host] if traefik_dashboard_public | default(true) else []) + (cloudflare_protected_records | default([])))
