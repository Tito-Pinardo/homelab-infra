---
# Repo de la web personal en Forgejo (origen desde el 14-10, ver
# docs/landing.md): repo, Actions, avisos del CI en Element, rama sin force
# push y registro del runner que la despliega (CT 123). Se incluye al final
# de main.yml: usa el secreto del webhook que lee main.yml.

- name: Comprobar si existe el repo de la web
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ forgejo_http_port }}/api/v1/repos/{{ forgejo_admin_user }}/{{ forgejo_repo_landing }}"
    user: "{{ forgejo_admin_user }}"
    password: "{{ forgejo_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: forgejo_landing_repo
  no_log: true

# Privado aqui: la copia publica es la de GitHub, que solo recibe lo que ha
# pasado el CI y el control de fugas del despliegue.
- name: Crear el repo de la web (privado)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ forgejo_http_port }}/api/v1/user/repos"
    method: POST
    user: "{{ forgejo_admin_user }}"
    password: "{{ forgejo_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ forgejo_repo_landing }}"
      private: true
      default_branch: main
      description: "{{ forgejo_repo_landing_descripcion }}"
    status_code: [201]
  when: forgejo_landing_repo.status == 404
  changed_when: true
  no_log: true

- name: Activar Actions y poner la descripcion del repo de la web
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ forgejo_http_port }}/api/v1/repos/{{ forgejo_admin_user }}/{{ forgejo_repo_landing }}"
    method: PATCH
    user: "{{ forgejo_admin_user }}"
    password: "{{ forgejo_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      has_actions: true
      description: "{{ forgejo_repo_landing_descripcion }}"
  changed_when: false
  no_log: true

# main admite push directo (el resumen semanal publica asi), pero no force
# push ni borrarla: lo desplegado y lo publicado en GitHub no se reescribe.
- name: Protecciones de rama del repo de la web
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ forgejo_http_port }}/api/v1/repos/{{ forgejo_admin_user }}/{{ forgejo_repo_landing }}/branch_protections"
    user: "{{ forgejo_admin_user }}"
    password: "{{ forgejo_admin_password }}"
    force_basic_auth: true
  register: forgejo_landing_protecciones
  no_log: true

- name: Proteger main de la web (sin force push)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ forgejo_http_port }}/api/v1/repos/{{ forgejo_admin_user }}/{{ forgejo_repo_landing }}/branch_protections"
    method: POST
    user: "{{ forgejo_admin_user }}"
    password: "{{ forgejo_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      rule_name: main
      enable_push: true
      enable_force_push: false
      required_approvals: 0
    status_code: [201]
  when: "'main' not in (forgejo_landing_protecciones.json | map(attribute='rule_name') | list)"
  changed_when: true
  no_log: true

- name: Webhooks del repo de la web
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ forgejo_http_port }}/api/v1/repos/{{ forgejo_admin_user }}/{{ forgejo_repo_landing }}/hooks"
    user: "{{ forgejo_admin_user }}"
    password: "{{ forgejo_admin_password }}"
    force_basic_auth: true
  register: forgejo_landing_hooks
  no_log: true

- name: Webhook de avisos del CI de la web
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ forgejo_http_port }}/api/v1/repos/{{ forgejo_admin_user }}/{{ forgejo_repo_landing }}/hooks"
    method: POST
    user: "{{ forgejo_admin_user }}"
    password: "{{ forgejo_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      type: forgejo
      active: true
      events: "{{ forgejo_ci_avisos_events }}"
      config:
        url: "http://127.0.0.1:{{ forgejo_ci_avisos_port }}/"
        content_type: json
        secret: "{{ forgejo_webhook_secret.content | b64decode | trim }}"
    status_code: [201]
  when: forgejo_landing_hooks.json | selectattr('config.url', 'equalto', 'http://127.0.0.1:' ~ forgejo_ci_avisos_port ~ '/') | list | length == 0
  changed_when: true
  no_log: true

# Runner que despliega la web (CT 123, usuario agent), solo para este repo.
# Aparte del de infra-tf: cada runner solo ve los trabajos de su repo.
- name: Generar el secreto del runner de la web (solo la primera vez)
  ansible.builtin.shell:
    cmd: "umask 077 && openssl rand -hex 20 > /etc/forgejo/runner_landing_secret"
    creates: /etc/forgejo/runner_landing_secret

- name: Leer el secreto del runner de la web
  ansible.builtin.slurp:
    src: /etc/forgejo/runner_landing_secret
  register: forgejo_landing_secret_raw
  no_log: true

- name: Guardar el secreto para el play del CT 123
  ansible.builtin.set_fact:
    forgejo_landing_secret: "{{ forgejo_landing_secret_raw.content | b64decode | trim }}"
  no_log: true

- name: Registrar el runner de la web (solo para su repo)
  ansible.builtin.command:
    argv:
      - /usr/local/bin/forgejo
      - --config
      - /etc/forgejo/app.ini
      - forgejo-cli
      - actions
      - register
      - --name
      - agents-landing
      - --scope
      - "{{ forgejo_admin_user }}/{{ forgejo_repo_landing }}"
      - --labels
      - landing-despliegue
      - --secret
      - "{{ forgejo_landing_secret }}"
  become: true
  become_user: git
  become_method: ansible.builtin.su
  changed_when: false
  no_log: true
