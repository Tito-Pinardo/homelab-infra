---
# Tautulli (estadisticas de Plex) - sustituye al stack manual en el CT106
# original. Sin secretos propios. Los datos (/opt/stacks/tautulli/data) se
# copian 1:1 desde el CT106 en un paso manual aparte, igual que el resto
# de migraciones de este repo - este role nunca los toca.

- name: Crear directorio del stack
  ansible.builtin.file:
    path: /opt/stacks/tautulli
    state: directory
    mode: "0755"

- name: Desplegar compose.yaml
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /opt/stacks/tautulli/compose.yaml
    mode: "0644"
  register: tautulli_compose

- name: Crear directorio de datos si no existe (primer despliegue, sin datos restaurados todavia)
  ansible.builtin.file:
    path: /opt/stacks/tautulli/data
    state: directory
    mode: "0755"

- name: Levantar el stack
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/tautulli
    state: present
    pull: missing
