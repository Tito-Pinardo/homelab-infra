---
# AMP (CubeCoders Application Management Panel), sustituye al CT 108.
# Detalle completo (arquitectura, bug de timeout conocido, UFW
# auto-sincronizado) en el runbook de Obsidian.
#
# Este role NUNCA toca /home/amp/.ampdata (usuarios/roles/2FA/instancias) -
# es estado de AMP, copiado 1:1 desde el CT108 original en un paso manual
# aparte (igual que /etc/dns en Technitium o la BD de Paperless). Tampoco
# toca los datos de juego (/mnt/minecraft, /mnt/steam) - son bind-mounts
# ZFS ya poblados, ver lxc-amp.tf.

- name: Instalar dependencias basicas
  ansible.builtin.apt:
    name: ["ca-certificates", "curl", "gnupg", "ufw"]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Crear directorio para claves GPG de apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Descargar la clave GPG oficial de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Anadir el repositorio apt de Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.asc
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_distribution_release }}"
    components: stable
    state: present

- name: Instalar Docker Engine + plugin compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Habilitar y arrancar Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Copiar la clave GPG del repo de CubeCoders (cdn-repo.c7rs.com)
  ansible.builtin.copy:
    src: cdn-repo.c7rs.com.gpg
    dest: /usr/share/keyrings/cdn-repo.c7rs.com.gpg
    mode: "0644"

- name: Anadir el repositorio apt de CubeCoders (ampinstmgr)
  ansible.builtin.deb822_repository:
    name: cubecoders
    types: deb
    signed_by: /usr/share/keyrings/cdn-repo.c7rs.com.gpg
    uris: https://cdn-repo.c7rs.com/
    suites: debian/
    state: present

- name: Instalar ampinstmgr (crea el usuario 'amp', /opt/cubecoders/amp, y las unidades systemd base)
  ansible.builtin.apt:
    name: ampinstmgr
    state: present
    update_cache: true

- name: Crear directorio de override de ampinstmgr.service
  ansible.builtin.file:
    path: /etc/systemd/system/ampinstmgr.service.d
    state: directory
    mode: "0755"

- name: Override de systemd para ampinstmgr.service (TimeoutStartSec=600)
  # Mitigacion de un bug real y recurrente (4 incidencias documentadas,
  # 07/07, 14/07, 08/07, 14/08 2026): el arranque de ampinstmgr hace
  # 'docker pull' de las imagenes base de cada instancia con Start on Boot,
  # y en el primer arranque tras un reboot esto puede superar el timeout
  # por defecto de systemd compitiendo por I/O. El pre-pull de imagenes de
  # abajo ataca la causa (evita el pull en si durante el arranque real);
  # este override es la mitigacion que ya existia en el CT108 original,
  # se mantiene como segunda red de seguridad.
  ansible.builtin.copy:
    dest: /etc/systemd/system/ampinstmgr.service.d/override.conf
    content: |
      [Service]
      TimeoutStartSec=600
    mode: "0644"
  notify: recargar systemd

- name: Pre-descargar las imagenes base de AMP (evita el 'docker pull' en el primer arranque real)
  ansible.builtin.command: docker pull docker.io/cubecoders/{{ item }}
  loop:
    - "ampbase:debian"
    - "ampbase:debian-12"
    - "ampbase:java"
    - "ampbase:java-25"
    - "ampbase:java-lts"
  register: amp_image_pull
  changed_when: "'Downloaded newer image' in amp_image_pull.stdout"

- name: Crear el usuario 'amp' (el paquete ampinstmgr NO lo crea solo - normalmente lo hace al crear la primera instancia, que aqui no aplica porque los datos se restauran desde el CT108)
  ansible.builtin.user:
    name: amp
    shell: /bin/bash
    create_home: true
    home: /home/amp
    groups: [docker, tty]
    append: true

- name: Crear /home/amp si no existe (primer despliegue, sin datos restaurados todavia)
  ansible.builtin.file:
    path: /home/amp
    state: directory
    owner: amp
    group: amp
    mode: "0750"

- name: Desplegar before.rules de UFW (SSH+panel restringidos a LAN, delante de las reglas que AMP sincroniza solo)
  ansible.builtin.template:
    src: ufw-before.rules.j2
    dest: /etc/ufw/before.rules
    mode: "0640"
  notify: recargar ufw

- name: Arranque de ufw siempre desde cero (drop-in y limpieza)
  ansible.builtin.include_tasks: ufw.yml

- name: Desplegar before6.rules de UFW (misma restriccion, IPv6)
  ansible.builtin.template:
    src: ufw-before6.rules.j2
    dest: /etc/ufw/before6.rules
    mode: "0640"
  notify: recargar ufw

- name: Fijar politicas por defecto de UFW (deny incoming/routed, allow outgoing)
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
    - { direction: routed, policy: deny }

- name: Activar logging de UFW (low, igual que el CT108 original)
  community.general.ufw:
    logging: low

- name: Permitir SSH desde la LAN
  community.general.ufw:
    rule: allow
    direction: in
    src: "{{ amp_lan_subnet }}"
    port: "22"
    proto: tcp
    comment: "Casa SSH LAN"

- name: Permitir el panel (8080) desde la LAN
  community.general.ufw:
    rule: allow
    direction: in
    src: "{{ amp_lan_subnet }}"
    port: "{{ amp_panel_port }}"
    proto: tcp
    comment: "Casa AMP panel LAN"

- name: Habilitar UFW
  community.general.ufw:
    state: enabled

- name: Habilitar y arrancar Docker antes que ampinstmgr (por si el orden de boot importa)
  ansible.builtin.systemd:
    name: docker
    enabled: true

- name: Habilitar ampinstmgr.service (arranque real se deja para despues de restaurar /home/amp/.ampdata)
  ansible.builtin.systemd:
    name: ampinstmgr.service
    enabled: true
    daemon_reload: true

- name: Habilitar y arrancar el temporizador de sincronizacion de firewall de AMP (cada 5 min)
  ansible.builtin.systemd:
    name: ampfirewall.timer
    enabled: true
    state: started

- name: Renderizar el firewall propio del CT en Proxmox (SSH restringido, resto sin tocar - UFW ya filtra el resto dentro del CT)
  ansible.builtin.set_fact:
    amp_fw_content: "{{ lookup('template', 'amp.fw.j2') }}"

- name: Leer el firewall actual del CT en el host Proxmox (si existe)
  ansible.builtin.slurp:
    src: "/etc/pve/firewall/{{ proxmox_vmid }}.fw"
  register: amp_fw_current
  failed_when: false
  delegate_to: 192.0.2.2
  vars:
    ansible_connection: ssh
    ansible_user: root
    ansible_host: 192.0.2.2

- name: Escribir el firewall propio del CT (solo 3 reglas de SSH)
  ansible.builtin.shell:
    cmd: "cat > /etc/pve/firewall/{{ proxmox_vmid }}.fw"
    stdin: "{{ amp_fw_content }}"
  when: >
    not amp_fw_current.content is defined or
    (amp_fw_current.content | default('') | b64decode) != amp_fw_content
  delegate_to: 192.0.2.2
  vars:
    ansible_connection: ssh
    ansible_user: root
    ansible_host: 192.0.2.2

- name: Descargar la clave GPG de Adoptium (Eclipse Temurin para Java)
  ansible.builtin.get_url:
    url: https://packages.adoptium.net/artifactory/api/gpg/key/public
    dest: /etc/apt/keyrings/adoptium.asc
    mode: "0644"

- name: Anadir el repositorio apt de Adoptium
  ansible.builtin.deb822_repository:
    name: adoptium
    types: deb
    signed_by: /etc/apt/keyrings/adoptium.asc
    uris: https://packages.adoptium.net/artifactory/deb
    suites: "{{ ansible_distribution_release }}"
    components: main
    state: present

- name: Instalar Java 21 y Java 25 de forma nativa
  ansible.builtin.apt:
    name:
      - temurin-21-jdk
      - temurin-25-jdk
    state: present
    update_cache: true

- name: GraalVM ya instalados
  ansible.builtin.find:
    paths: /usr/lib/jvm
    patterns: "graalvm-jdk-*"
    file_type: directory
  register: amp_graalvm

- name: Descargar e instalar Oracle GraalVM para Java 21
  ansible.builtin.unarchive:
    src: "https://download.oracle.com/graalvm/21/latest/graalvm-jdk-21_linux-x64_bin.tar.gz"
    dest: /usr/lib/jvm/
    remote_src: true
  # "latest" no deja usar creates con la ruta exacta: se instala solo si no hay ninguna.
  when: not (amp_graalvm.files | selectattr('path', 'search', 'graalvm-jdk-21') | list)

- name: Descargar e instalar Oracle GraalVM para Java 25 (LTS)
  ansible.builtin.unarchive:
    src: "https://download.oracle.com/graalvm/25/latest/graalvm-jdk-25_linux-x64_bin.tar.gz"
    dest: /usr/lib/jvm/
    remote_src: true
  # "latest" no deja usar creates con la ruta exacta: se instala solo si no hay ninguna.
  when: not (amp_graalvm.files | selectattr('path', 'search', 'graalvm-jdk-25') | list)
