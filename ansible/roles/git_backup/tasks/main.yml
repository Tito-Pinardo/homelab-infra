---
# Segundo repo bare de infra-tf, en un CT DISTINTO del disco de lucifer (que
# aloja tanto el arbol de trabajo como el otro bare repo, "sync") - sin esto,
# un fallo de disco/robo/ransomware en ese unico equipo pierde las dos
# copias a la vez. Se apoya en git-shell (mecanismo NATIVO de git, no un
# comando forzado artesanal como el de monitoring-push): esa cuenta solo
# puede hacer git-upload-pack/git-receive-pack, ni siquiera una shell.
#
# Se reutiliza este CT (dns-sync, Alpine, ya ligero y siempre encendido) en
# vez de crear uno nuevo solo para esto - el repo entero pesa unos pocos MB
# (solo texto, sin binarios versionados), no justifica otro CT dedicado.

- name: Instalar git
  community.general.apk:
    name: git
    state: present

- name: Localizar el binario de git-shell
  ansible.builtin.command: which git-shell
  register: git_shell_path
  changed_when: false

- name: Anadir git-shell a /etc/shells (shell de login valida)
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ git_shell_path.stdout }}"
    create: true

- name: Crear grupo de sistema para el respaldo de git
  # Alpine (busybox adduser), a diferencia de Debian, NO crea un grupo
  # propio por usuario automaticamente - mismo gotcha ya visto en dns_sync.
  # Sin este paso, el usuario cae en "nogroup" y el chgrp del directorio
  # .ssh de mas abajo falla.
  ansible.builtin.group:
    name: git-backup
    system: true

- name: Crear usuario de sistema para el respaldo de git
  ansible.builtin.user:
    name: git-backup
    system: true
    create_home: true
    home: /home/git-backup
    group: git-backup
    shell: "{{ git_shell_path.stdout }}"

- name: Crear directorio .ssh de git-backup
  ansible.builtin.file:
    path: /home/git-backup/.ssh
    state: directory
    owner: git-backup
    group: git-backup
    mode: "0700"

- name: Autorizar las claves de las maquinas que pueden empujar el respaldo
  ansible.builtin.copy:
    dest: /home/git-backup/.ssh/authorized_keys
    owner: git-backup
    group: git-backup
    mode: "0600"
    content: |
      {% for key in git_backup_authorized_keys %}
      no-pty,no-agent-forwarding,no-X11-forwarding,no-port-forwarding {{ key }}
      {% endfor %}

- name: Crear el repo bare de respaldo (si no existe)
  # Sin become_user aqui: Alpine no trae sudo instalado por defecto (ya
  # conectamos como root via SSH, become_user fallaria con "sudo: not
  # found"). Se crea como root y se corrige el propietario en la tarea
  # siguiente.
  ansible.builtin.command: git init --bare /home/git-backup/infra-tf-backup.git
  args:
    creates: /home/git-backup/infra-tf-backup.git/HEAD

- name: Propietario correcto del repo bare de respaldo
  ansible.builtin.file:
    path: /home/git-backup/infra-tf-backup.git
    owner: git-backup
    group: git-backup
    recurse: true
