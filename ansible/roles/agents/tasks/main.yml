---
# CT 123 "agents": CT de control + agentes IA con Codeman como panel.
# Ver lxc-agents.tf para el porque y group_vars/agents/vars.yml para
# versiones. La autorizacion de su clave SSH en el resto de la flota va
# APARTE (playbooks/agents-access.yml) para que sea facil de revisar y de
# revocar sin tocar este role.

# ── Firewall Proxmox del CT (en el host, no dentro del CT) ──────────────
# enable: 1 + policy_in DROP explicitos: un .fw solo con [RULES] NO se
# aplica (comprobado 2026-09-22 - el DROP del CT 115 no bloqueaba nada).
#
# /etc/pve es pmxcfs: ni template/copy (chmod, rename atomico) ni
# unsafe_writes funcionan (Operation not permitted, probado 2026-09-22).
# Se renderiza fuera y se vuelca con 'cat >', igual que
# register_monitoring.py.
- name: Renderizar el firewall Proxmox del CT fuera de /etc/pve
  ansible.builtin.template:
    src: agents.fw.j2
    dest: "/root/pve-fw-staging-{{ proxmox_vmid }}.fw"
    mode: "0600"
  delegate_to: 192.0.2.2
  remote_user: root
  become: false

- name: Volcar el firewall del CT (SSH admin + Codeman solo desde Caddy)
  ansible.builtin.shell:
    cmd: >-
      cmp -s /root/pve-fw-staging-{{ proxmox_vmid }}.fw /etc/pve/firewall/{{ proxmox_vmid }}.fw
      || { cat /root/pve-fw-staging-{{ proxmox_vmid }}.fw > /etc/pve/firewall/{{ proxmox_vmid }}.fw && echo CHANGED; }
  register: agents_fw_write
  changed_when: "'CHANGED' in agents_fw_write.stdout"
  delegate_to: 192.0.2.2
  remote_user: root
  become: false

# ── Paquetes base ────────────────────────────────────────────────────────
- name: Instalar dependencias basicas
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - tmux
      - unzip
      - jq
      - ripgrep
      - acl # become_user a 'agent' (ficheros temporales de Ansible)
      - sudo # become_user a 'agent' (la plantilla Debian no lo trae)
      - pipx
      - python3-venv
      - openssh-client
      - dnsutils
      - build-essential
    state: present
    update_cache: true
    cache_valid_time: 3600

# Debian 13 trae Node 20 y Claude Code pide >= 22.
- name: Crear directorio para claves GPG de apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Descargar la clave GPG de NodeSource
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Anadir el repositorio apt de NodeSource (Node {{ agents_node_major }})
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ agents_node_major }}.x nodistro main"
    state: present
    filename: nodesource

- name: Instalar Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Instalar Codeman y los CLI de agentes (versiones fijadas)
  community.general.npm:
    name: "{{ item.name }}"
    version: "{{ item.version }}"
    global: true
    state: present
  loop: "{{ agents_npm_packages }}"
  loop_control:
    label: "{{ item.name }}@{{ item.version }}"
  # El postinstall de aicodeman ARRANCA un servidor Codeman como root en
  # :3000 (detached, fuera de systemd) salvo esta variable - visto en real
  # 2026-09-22.
  environment:
    CODEMAN_NO_AUTOSTART: "1"
  notify: reiniciar codeman

- name: Matar cualquier Codeman lanzado como root (postinstall de versiones anteriores)
  ansible.builtin.command:
    cmd: pkill -u root -f 'aicodeman/dist/index.js web'
  register: agents_codeman_root
  changed_when: agents_codeman_root.rc == 0
  failed_when: agents_codeman_root.rc not in [0, 1]

- name: Borrar el estado de ese Codeman de root
  ansible.builtin.file:
    path: /root/.codeman
    state: absent

- name: Descargar Terraform {{ agents_terraform_version }}
  ansible.builtin.unarchive:
    src: "https://releases.hashicorp.com/terraform/{{ agents_terraform_version }}/terraform_{{ agents_terraform_version }}_linux_amd64.zip"
    dest: /usr/local/bin
    remote_src: true
    include: [terraform]
    creates: "/usr/local/bin/.terraform-{{ agents_terraform_version }}"

- name: Marcar la version de Terraform instalada
  ansible.builtin.file:
    path: "/usr/local/bin/.terraform-{{ agents_terraform_version }}"
    state: touch
    modification_time: preserve
    access_time: preserve

# ── Usuario de los agentes ───────────────────────────────────────────────
- name: Crear el usuario '{{ agents_user }}' con su propia clave SSH
  ansible.builtin.user:
    name: "{{ agents_user }}"
    shell: /bin/bash
    create_home: true
    generate_ssh_key: true
    ssh_key_type: ed25519
    ssh_key_comment: "agent@agents (CT {{ proxmox_vmid }})"

# Alias de la ruta vieja: las sesiones de Codex/Claude migradas desde el PC
# lucifer (2026-09-22) guardan rutas absolutas /home/lucifer/... (infra-tf,
# auditoria-casa, .codex/sessions) - asi siguen resolviendo al reanudarlas.
- name: Alias /home/lucifer -> /home/{{ agents_user }} (sesiones migradas de lucifer)
  ansible.builtin.file:
    src: "/home/{{ agents_user }}"
    dest: /home/lucifer
    state: link

# Mismas claves admin (Mac + lucifer) que root, para 'ssh agent@agents'.
- name: Autorizar las claves admin tambien para '{{ agents_user }}'
  ansible.builtin.copy:
    src: /root/.ssh/authorized_keys
    dest: "/home/{{ agents_user }}/.ssh/authorized_keys"
    remote_src: true
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0600"

# Hereda la confianza de host keys que ya tiene el nodo de control
# (lucifer), en vez de aceptar claves a ciegas la primera vez.
- name: Copiar las host keys conocidas del homelab
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/.ssh/known_hosts"
    dest: "/home/{{ agents_user }}/.ssh/known_hosts_homelab"
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0644"

- name: Anadir la host key de lucifer (repo git) a las conocidas
  ansible.builtin.known_hosts:
    # En su propio known_hosts, no en el _homelab (la copia de arriba lo
    # sobreescribiria en cada pasada).
    path: "/home/{{ agents_user }}/.ssh/known_hosts"
    name: 192.0.2.30
    key: "192.0.2.30 {{ lookup('file', '/etc/ssh/ssh_host_ed25519_key.pub') }}"

- name: known_hosts propio del usuario (known_hosts lo crea como root)
  ansible.builtin.file:
    path: "/home/{{ agents_user }}/.ssh/known_hosts"
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0644"

- name: Configuracion SSH del usuario '{{ agents_user }}'
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "/home/{{ agents_user }}/.ssh/config"
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0600"

# Ya no hay contraseña del vault (secretos en OpenBao, docs/secretos.md).
- name: Quitar la contrasena del vault de infra-tf
  ansible.builtin.file:
    path: "/home/{{ agents_user }}/.vault-pass-infra-tf"
    state: absent

- name: Identidad git de los agentes
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - { name: user.name, value: "Agentes IA (CT {{ proxmox_vmid }})" }
    - { name: user.email, value: "agent@agents.home.arpa" }
  become: true
  become_user: "{{ agents_user }}"

# ── Ansible para el usuario 'agent' ──────────────────────────────────────
# state: present no actualiza si ya hay otra version instalada (con
# Renovate subiendo la version, el CT se quedaba en la vieja): se mira la
# instalada y se reinstala solo si no coincide.
- name: Version de ansible-core instalada
  ansible.builtin.command:
    argv: [pipx, runpip, ansible-core, show, ansible-core]
  become: true
  become_user: "{{ agents_user }}"
  register: agents_ansible_instalado
  changed_when: false
  failed_when: false

- name: Instalar ansible-core {{ agents_ansible_core_version }} con pipx (primera vez)
  community.general.pipx:
    name: ansible-core
    source: "ansible-core=={{ agents_ansible_core_version }}"
    state: present
  become: true
  become_user: "{{ agents_user }}"

# Dentro del mismo venv: un 'pipx install --force' lo rehace de cero y pierde
# lo inyectado (paramiko, abajo).
- name: Llevar ansible-core a {{ agents_ansible_core_version }} si es otra version
  ansible.builtin.command:
    argv: [pipx, runpip, ansible-core, install, "ansible-core=={{ agents_ansible_core_version }}"]
  become: true
  become_user: "{{ agents_user }}"
  when:
    - agents_ansible_instalado.rc == 0
    - "('Version: ' ~ agents_ansible_core_version) not in agents_ansible_instalado.stdout"
  changed_when: true

# paramiko: lo necesita community.proxmox.proxmox_pct_remote (paperless).
- name: Inyectar dependencias de las colecciones en el venv de ansible
  community.general.pipx:
    name: ansible-core
    state: inject
    inject_packages: [paramiko]
  become: true
  become_user: "{{ agents_user }}"

- name: Instalar colecciones de Ansible
  ansible.builtin.command:
    cmd: "/home/{{ agents_user }}/.local/bin/ansible-galaxy collection install {{ agents_ansible_collections | join(' ') }}"
  register: agents_galaxy
  changed_when: "'was installed successfully' in agents_galaxy.stdout"
  become: true
  become_user: "{{ agents_user }}"

# ── Agente local (OpenCode -> Ollama de lucifer) ─────────────────────────
- name: Crear directorio de config de OpenCode
  ansible.builtin.file:
    path: "/home/{{ agents_user }}/.config/opencode"
    state: directory
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0755"

- name: Configurar OpenCode con el Ollama de lucifer
  ansible.builtin.template:
    src: opencode.json.j2
    dest: "/home/{{ agents_user }}/.config/opencode/opencode.json"
    owner: "{{ agents_user }}"
    group: "{{ agents_user }}"
    mode: "0644"

# ── Retirada de Vibe Kanban (2026-09-22, sustituido por Codeman) ─────────
# Idempotente: en un CT recreado desde cero no encuentra nada y no hace nada.
- name: Comprobar si queda el servicio de Vibe Kanban
  ansible.builtin.stat:
    path: /etc/systemd/system/vibe-kanban.service
  register: agents_vk_unit

- name: Parar y deshabilitar Vibe Kanban
  ansible.builtin.systemd:
    name: vibe-kanban
    state: stopped
    enabled: false
  when: agents_vk_unit.stat.exists

- name: Borrar la unidad, el paquete y los datos de Vibe Kanban
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/vibe-kanban.service
    - "/home/{{ agents_user }}/.vibe-kanban"
    - "/home/{{ agents_user }}/.local/share/vibe-kanban"
    - /var/tmp/vibe-kanban
    - /tmp/vibe-kanban
  register: agents_vk_files

- name: Desinstalar el paquete npm de Vibe Kanban
  community.general.npm:
    name: vibe-kanban
    global: true
    state: absent

- name: Recargar systemd tras borrar la unidad de Vibe Kanban
  ansible.builtin.systemd:
    daemon_reload: true
  when: agents_vk_files.changed

# ── Codeman ──────────────────────────────────────────────────────────────
- name: Secreto de Codeman (contrasena del panel)
  ansible.builtin.copy:
    content: "CODEMAN_PASSWORD={{ agents_codeman_password }}\n"
    dest: /etc/codeman.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: reiniciar codeman

- name: Desplegar unidad systemd de Codeman
  ansible.builtin.template:
    src: codeman.service.j2
    dest: /etc/systemd/system/codeman.service
    mode: "0644"
  notify: reiniciar codeman

- name: Habilitar y arrancar Codeman
  ansible.builtin.systemd:
    name: codeman
    enabled: true
    state: started
    daemon_reload: true

- name: Resumen semanal de los lunes del blog
  ansible.builtin.include_tasks: digest.yml
  when: agents_digest_enabled | bool
