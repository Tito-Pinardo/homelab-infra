---
# Seerr (solicitudes de contenido) - sustituye al stack manual en el CT106
# original. Sin secretos propios. Los datos (/opt/stacks/seerr/config) se
# copian 1:1 desde el CT106 en un paso manual aparte.

- name: Crear directorio del stack
  ansible.builtin.file:
    path: /opt/stacks/seerr
    state: directory
    mode: "0755"

- name: Desplegar compose.yaml
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /opt/stacks/seerr/compose.yaml
    mode: "0644"

- name: Crear directorio de config si no existe (primer despliegue, sin datos restaurados todavia)
  ansible.builtin.file:
    path: /opt/stacks/seerr/config
    state: directory
    mode: "0755"
    owner: "1000"
    group: "1000"

- name: Levantar el stack
  community.docker.docker_compose_v2:
    project_src: /opt/stacks/seerr
    state: present
    pull: missing
