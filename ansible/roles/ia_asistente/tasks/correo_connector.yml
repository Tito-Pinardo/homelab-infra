# Conector de correo (Fase 5, la mas sensible). Corre como el mismo usuario
# obsidian-sync (ya existe, ya tiene acceso de escritura a /var/lib/ia-asistente
# para su propio estado) - no hace falta un usuario nuevo solo para esto.

- name: Desplegar el script del conector de correo
  ansible.builtin.copy:
    src: sync_correo.py
    dest: /usr/local/bin/sync_correo.py
    owner: obsidian-sync
    group: obsidian-sync
    mode: "0750"
  # Desde que paso a ser un servicio PERSISTENTE (2026-09-18, ya no un
  # oneshot de cron): sin este notify, un cambio de codigo aqui nunca se
  # recogeria hasta el siguiente reinicio manual o del CT.
  notify: reiniciar sync-correo

- name: "Desplegar servicio systemd persistente del conector de correo (IMAP IDLE, ya no timer)"
  ansible.builtin.template:
    src: sync-correo.service.j2
    dest: /etc/systemd/system/sync-correo.service
    mode: "0644"
  notify: reiniciar sync-correo

- name: Habilitar y arrancar sync-correo
  ansible.builtin.systemd:
    name: sync-correo
    enabled: true
    state: started
    daemon_reload: true
