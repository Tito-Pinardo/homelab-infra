---
# Alpine, no Debian - primer role del repo con apk en vez de apt. La
# plantilla base de Proxmox no trae sshd ni python3 (bootstrap de ambos
# hecho a mano via pct exec antes de que Ansible pudiera conectar siquiera -
# ver runbook). crond SI viene activo de serie en Alpine.

- name: Instalar bash, curl, jq y certificados (Alpine no trae nada de esto)
  community.general.apk:
    name:
      - bash
      - curl
      - jq
      - ca-certificates
    update_cache: true
    state: present

- name: Desplegar el script consolidado de sincronizacion DNS
  ansible.builtin.template:
    src: dns-sync.sh.j2
    dest: /usr/local/bin/dns-sync.sh
    mode: "0700"
    owner: root
    group: root

- name: Programar la ejecucion cada 5 minutos (crond ya viene activo en Alpine)
  ansible.builtin.cron:
    name: "sincronizar DNS dinamico con Cloudflare"
    minute: "*/5"
    job: "/usr/local/bin/dns-sync.sh >> /var/log/dns-sync.log 2>&1"
    user: root
