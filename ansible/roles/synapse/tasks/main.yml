---
- name: Instalar PostgreSQL y dependencias
  ansible.builtin.apt:
    name:
      - postgresql
      - python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Habilitar y arrancar PostgreSQL
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started

- name: Crear usuario de base de datos para Synapse
  # become_method: su porque esta plantilla Debian minima no trae `sudo`
  # instalado (y no hace falta instalarlo solo para este paso puntual).
  community.postgresql.postgresql_user:
    name: "{{ synapse_db_user }}"
    password: "{{ synapse_db_password }}"
    state: present
  become_user: postgres
  become_method: ansible.builtin.su

- name: Crear base de datos de Synapse
  # Synapse EXIGE encoding UTF8 + collation C - si la BD se crea con el
  # locale por defecto del sistema, Synapse se niega a arrancar (lo dice en
  # sus propios logs al primer boot). template0 hace falta porque template1
  # ya tiene el locale del sistema fijado y no se puede cambiar sobre él.
  community.postgresql.postgresql_db:
    name: "{{ synapse_db_name }}"
    owner: "{{ synapse_db_user }}"
    encoding: UTF8
    lc_collate: C
    lc_ctype: C
    template: template0
    state: present
  become_user: postgres
  become_method: ansible.builtin.su

- name: Descargar la clave GPG del repo de Matrix.org
  ansible.builtin.get_url:
    url: https://packages.matrix.org/debian/matrix-org-archive-keyring.gpg
    dest: /usr/share/keyrings/matrix-org-archive-keyring.gpg
    mode: "0644"

- name: Añadir el repo apt de Matrix.org (paquete oficial, sin Docker)
  ansible.builtin.deb822_repository:
    name: matrix-org
    types: deb
    uris: https://packages.matrix.org/debian/
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: /usr/share/keyrings/matrix-org-archive-keyring.gpg
    state: present
  register: synapse_repo

# Solo si el repo cambia (deb822_repository no actualiza la cache): antes
# se actualizaba siempre y salia como cambiado en cada despliegue.
# Tarea y no handler: tiene que ir ya, antes de instalar el paquete.
- name: Actualizar cache de apt tras añadir el repo  # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when: synapse_repo is changed

- name: Preseleccionar server_name en debconf (evita el prompt interactivo del paquete)
  # El postinst del paquete genera /etc/matrix-synapse/homeserver.yaml solo
  # (con signing key y secretos incluidos) usando esta respuesta - por eso NO
  # hace falta un "synapse generate-config" manual.
  ansible.builtin.debconf:
    name: matrix-synapse-py3
    question: matrix-synapse/server-name
    value: "{{ synapse_server_name }}"
    vtype: string

- name: Instalar matrix-synapse-py3
  ansible.builtin.apt:
    name: matrix-synapse-py3
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Carpeta de ajustes locales de la unidad de Synapse
  ansible.builtin.file:
    path: /etc/systemd/system/matrix-synapse.service.d
    state: directory
    mode: "0755"

- name: Dar a Synapse 5 min para arrancar
  # El ExecStartPre (comprobar la config y las claves) a veces pasa de los
  # 90 s por defecto en frio; el 18-10 un reinicio fallo por eso y tumbo el relay.
  ansible.builtin.copy:
    dest: /etc/systemd/system/matrix-synapse.service.d/tiempos.conf
    content: |
      [Service]
      TimeoutStartSec=300
    mode: "0644"
  notify: recargar systemd

- name: Desplegar overrides (postgres, registro, federacion) sin tocar homeserver.yaml
  # homeserver.yaml lo genera el paquete UNA vez con secretos propios (signing
  # key, macaroon) que no se deben regenerar en cada run. Synapse soporta
  # cargar /etc/matrix-synapse/conf.d/*.yaml como capa adicional que
  # sobreescribe claves puntuales - eso es lo unico que gestiona Ansible aqui.
  ansible.builtin.template:
    src: conf.d-overrides.yaml.j2
    dest: /etc/matrix-synapse/conf.d/homelab.yaml
    owner: matrix-synapse
    group: nogroup
    mode: "0640"
  notify: reiniciar synapse

- name: Habilitar y arrancar Synapse
  ansible.builtin.systemd:
    name: matrix-synapse
    enabled: true
    state: started

- name: Instalar matrix-nio con soporte E2EE (paquete Debian, incluye python3-olm)
  ansible.builtin.apt:
    name: python3-matrix-nio
    state: present

- name: Crear usuario de sistema para el relay de Matrix
  ansible.builtin.user:
    name: matrix-relay
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Crear directorios del relay
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: matrix-relay
    group: matrix-relay
    mode: "0700"
  loop:
    - /var/lib/matrix-relay
    - /var/lib/matrix-relay/store

- name: Desplegar el script del relay E2EE
  ansible.builtin.copy:
    src: matrix_relay.py
    dest: /usr/local/bin/matrix_relay.py
    owner: matrix-relay
    group: matrix-relay
    mode: "0750"
  notify: reiniciar matrix-relay

- name: Desplegar unidad systemd del relay
  ansible.builtin.template:
    src: matrix-relay.service.j2
    dest: /etc/systemd/system/matrix-relay.service
    mode: "0644"
  notify: reiniciar matrix-relay

- name: Habilitar y arrancar el relay de Matrix
  ansible.builtin.systemd:
    name: matrix-relay
    enabled: true
    state: started
    daemon_reload: true
