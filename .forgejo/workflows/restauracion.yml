# Prueba de restauracion de las copias de PBS (runner "despliegue" del CT 123).
# Ver docs/copias.md. Cada domingo restaura un grupo de CT en CT temporales y
# comprueba los mundos de Minecraft; cada CT se prueba una vez al mes. Avisa
# en Element (resumen en CI/CD, fallos en Incidencias). A mano: Run workflow.
name: Prueba de restauracion

on:
  schedule:
    # Domingo 06:00 UTC (08:00 en Madrid en verano): despues de las copias y
    # de la verificacion semanal de PBS.
    - cron: "0 6 * * 0"
  workflow_dispatch:

env:
  PY: /home/agent/.local/share/pipx/venvs/ansible-core/bin/python
  ARBOL: /home/agent/.infra-tf/copias/infra-tf

jobs:
  restaurar:
    runs-on: despliegue
    steps:
      - name: Copia del repo (master)
        run: |
          [ -d "$ARBOL/.git" ] || git clone -q ssh://git@192.0.2.235:2222/tito/infra-tf.git "$ARBOL"
          git -C "$ARBOL" fetch -q --prune origin
          git -C "$ARBOL" checkout -q -f --detach origin/master
      - name: Restaurar y comprobar
        run: '"$PY" "$ARBOL/scripts/copias/prueba_restauracion.py"'
